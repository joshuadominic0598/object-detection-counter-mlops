name: object-counter

services:
  api:
    build: .
    image: object-counter-api:local
    env_file: .env
    environment:
      DATABASE_BACKEND: ${DATABASE_BACKEND:-mongodb}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-counter}
      SQLITE_PATH: /data/counter.sqlite3
      MODEL_PATH: ${MODEL_PATH:-}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - sqlite_data:/data
      - ./tmp:/app/tmp
      - ./results:/app/results
      - ./model_management:/app/model_management
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    profiles: [mongodb]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  sqlite_data:
  mongo_data:
